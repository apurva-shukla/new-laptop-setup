# ─────────────────────────────────────────────────────────────
# Tmux Configuration - Catppuccin Mocha Theme
# ─────────────────────────────────────────────────────────────

# --- Prefix Key ---
# Change prefix from Ctrl+b to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- General Settings ---
set -g set-clipboard on
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Smooth scrolling - scroll 1 line at a time
bind -T copy-mode WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode WheelDownPane select-pane \; send-keys -X -N 1 scroll-down

set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 0
set -g focus-events on

# --- Keybindings ---
# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes with | and -
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind -n M-\\ split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navigate panes with ijkl (spatial layout: j=left, k=down, i=up, l=right)
bind j select-pane -L
bind k select-pane -D
bind i select-pane -U
bind l select-pane -R

# Resize panes with Ctrl + ijkl
bind -r C-j resize-pane -L 5
bind -r C-k resize-pane -D 5
bind -r C-i resize-pane -U 5
bind -r C-l resize-pane -R 5

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Window management (no prefix needed)
bind -n M-S-Right next-window
bind -n M-S-Left previous-window
bind -n M-c new-window -c "#{pane_current_path}"

# Quick window switching with Alt+number
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ─────────────────────────────────────────────────────────────
# Catppuccin Mocha Theme (matches Ghostty)
# ─────────────────────────────────────────────────────────────
# Colors
thm_bg="#1e1e2e"
thm_fg="#cdd6f4"
thm_cyan="#89dceb"
thm_black="#181825"
thm_gray="#313244"
thm_magenta="#cba6f7"
thm_pink="#f5c2e7"
thm_red="#f38ba8"
thm_green="#a6e3a1"
thm_yellow="#f9e2af"
thm_blue="#89b4fa"
thm_orange="#fab387"
thm_black4="#585b70"

# Status bar
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=${thm_bg},fg=${thm_fg}"

# Status left (session name)
set -g status-left-length 30
set -g status-left "#[bg=${thm_blue},fg=${thm_black},bold] #S #[bg=${thm_bg}] "

# Status right (time/date)
set -g status-right-length 50
set -g status-right "#[fg=${thm_fg}]%H:%M #[fg=${thm_black4}]│ #[fg=${thm_fg}]%b %d "

# Window status
set -g window-status-format "#[fg=${thm_black4}] #I:#W "
set -g window-status-current-format "#[bg=${thm_gray},fg=${thm_green},bold] #I:#W "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_green}"

# Message style
set -g message-style "bg=${thm_gray},fg=${thm_fg}"

# Mode style (selection)
setw -g mode-style "bg=${thm_blue},fg=${thm_black}"
