# AeroSpace config — simplified 2026-07-11.
# Previous (full yabai-port) config: aerospace.toml.full-backup
#
# The whole mental model:
#   - 4 context workspaces, cmd-1..4 to go there, alt-shift-1..4 to send a window there
#   - left monitor: 1-left and 2-comms; right monitor: 3-work and 4-flex
#   - alt-j/k/i/l moves focus, add shift to move the window
#   - alt-a stacks windows fullscreen-style (accordion), alt-b un-stacks to tiles
#   - alt-r fixes any weird layout
#   - never use the green fullscreen button

config-version = 2

start-at-login = true

# Keep the four context workspaces available even when they are empty.
persistent-workspaces = [
  '1-left',
  '2-comms',
  '3-work',
  '4-flex',
]

# When keyboard focus crosses displays, bring the pointer along.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Visible strip (px) of hidden windows in accordion (alt-a)
accordion-padding = 30

# Portrait monitors split top/bottom; landscape monitors split left/right.
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Green focus border (JankyBorders)
after-startup-command = [
  'exec-and-forget pkill -x borders; /opt/homebrew/bin/borders active_color=0xff00ff00 inactive_color=0x00000000 width=6.0 style=round',
]

[gaps]
inner.horizontal = 4
inner.vertical = 4
outer.top = 0
outer.bottom = 4
outer.left = 4
outer.right = 4

[workspace-to-monitor-force-assignment]
# Prefer the two desk monitors by exact model name. The role fallbacks keep all
# workspaces reachable with a different two-monitor setup or only one display.
"1-left" = ['^DELL S2725QC$', 'secondary', 'main']
"2-comms" = ['^DELL S2725QC$', 'secondary', 'main']
"3-work" = ['^DELL U2725QE$', 'main']
"4-flex" = ['^DELL U2725QE$', 'main']

[mode.main.binding]

# focus / move window
alt-j = 'focus --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors left'
alt-k = 'focus --boundaries all-monitors-outer-frame down'
alt-i = 'focus --boundaries all-monitors-outer-frame up'
alt-l = 'focus --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors right'
alt-shift-j = 'move left'
alt-shift-k = 'move down'
alt-shift-i = 'move up'
alt-shift-l = 'move right'

# switch displays / send the focused window to the other display
alt-period = 'focus-monitor --wrap-around next'
alt-shift-period = 'move-node-to-monitor --focus-follows-window --wrap-around next'

# layouts: stack (accordion) <-> tiles while preserving monitor orientation
alt-a = 'layout accordion'
alt-b = 'layout tiles'
alt-f = 'layout floating tiling'
alt-r = 'flatten-workspace-tree'

# resize focused window
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# workspaces
cmd-1 = 'workspace 1-left'
cmd-2 = 'workspace 2-comms'
cmd-3 = 'workspace 3-work'
cmd-4 = 'workspace 4-flex'
# alt-shift like the directional move keys — cmd-shift-1/3/4 stay free for
# Loom and macOS screenshots
alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1-left'
alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2-comms'
alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3-work'
alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4-flex'

# cycle through occupied workspaces (empty ones are skipped automatically)
ctrl-left = 'list-workspaces --monitor focused --empty no | workspace --wrap-around --stdin prev'
ctrl-right = 'list-workspaces --monitor focused --empty no | workspace --wrap-around --stdin next'

# jump back to the previously focused workspace
alt-tab = 'workspace-back-and-forth'

ctrl-alt-cmd-r = 'reload-config'

# ── apps that live on a fixed workspace (and jump you there on open) ─────────

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap'
run = ['move-node-to-workspace 2-comms', 'workspace 2-comms']

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.openai.codex'
run = ['move-node-to-workspace 3-work', 'workspace 3-work']

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.figma.Desktop'
run = ['move-node-to-workspace 4-flex', 'workspace 4-flex']

[[on-window-detected]]
if = 'test %{app-bundle-id} = us.zoom.xos'
run = ['move-node-to-workspace 4-flex', 'workspace 4-flex']

[[on-window-detected]]
if = 'test %{app-bundle-id} = net.whatsapp.WhatsApp'
run = ['move-node-to-workspace 2-comms', 'workspace 2-comms']

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.MobileSMS'
run = ['move-node-to-workspace 2-comms', 'workspace 2-comms']

# ── utility apps that should float, never tile ───────────────────────────────

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.reminders'
run = 'layout floating'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.raycast.macos'
run = 'layout floating'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.loom.desktop'
run = 'layout floating'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.timpler.screenstudio'
run = 'layout floating'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.hegenberg.BetterTouchTool'
run = 'layout floating'

[[on-window-detected]]
if = 'test %{app-bundle-id} = cc.ffitch.shottr'
run = 'layout floating'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.prakashjoshipax.VoiceInk'
run = 'layout floating'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if = 'test %{app-bundle-id} = me.damir.dropover-mac'
run = 'layout floating'

# Bitwarden is a Chrome extension popup, so it shares Chrome's bundle ID.
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.google.Chrome && test %{window-title} ~= bitwarden'
run = 'layout floating'
